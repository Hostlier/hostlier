name: Build Hostlier controller

# Shared packages and module changes trigger both workflows. Exclusive packages
# are excluded below; new packages default to both until their ownership is known.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hostlier-controller.yml'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'scripts/check-binary-boundaries.sh'
      - 'cmd/hostlier-controller/**'
      - 'internal/**'
      - 'pkg/**'
      - 'test/**'
      - '!internal/cli/**'
      - '!internal/client/**'
      - '!internal/controllerbinary/**'
      - '!internal/localui/**'
      - '!internal/skills/**'
      - '!pkg/product/**'
      - '!internal/quality/**'
      - 'collector/**'
      - 'scripts/release.sh'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/hostlier-controller.yml'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'scripts/check-binary-boundaries.sh'
      - 'cmd/hostlier-controller/**'
      - 'internal/**'
      - 'pkg/**'
      - 'test/**'
      - '!internal/cli/**'
      - '!internal/client/**'
      - '!internal/controllerbinary/**'
      - '!internal/localui/**'
      - '!internal/skills/**'
      - '!pkg/product/**'
      - '!internal/quality/**'
      - 'collector/**'
      - 'scripts/release.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostlier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .
    shell: bash

jobs:
  test:
    name: Controller and CLI regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: go.sum
      - name: Verify locked dependencies
        run: |
          go mod download
          go mod verify
      - name: Verify separate executable dependencies
        run: ./scripts/check-binary-boundaries.sh
      - name: Static checks and race tests
        run: |
          go vet ./...
          go test -race -mod=readonly ./...

  ssh-live:
    name: Managed SSH / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache-dependency-path: go.sum
      - name: Verify real account provisioning and SSH revocation
        run: python3 test/e2e/ssh/run.py

  controller:
    name: Linux controller installation bundles
    needs: [test, ssh-live]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            go.sum
            collector/lock/go.sum
      # The release script builds both Linux architectures and includes the collector OCI assets.
      - name: Build complete server installation bundles
        run: make release
      - name: Verify bundles and smoke-test the native controller executable
        run: |
          for arch in amd64 arm64; do
            archive="hostlier-controller-linux-${arch}.tar.gz"
            (cd dist/releases && sha256sum -c "${archive}.sha256")
            tar -tzf "dist/releases/$archive" > "$RUNNER_TEMP/hostlier-${arch}-contents.txt"
            grep -Fx 'hostlier-controller' "$RUNNER_TEMP/hostlier-${arch}-contents.txt"
            grep -Fx 'collector-image/index.json' "$RUNNER_TEMP/hostlier-${arch}-contents.txt"
            grep -Fx 'collector-image/oci-layout' "$RUNNER_TEMP/hostlier-${arch}-contents.txt"
          done
          mkdir -p "$RUNNER_TEMP/hostlier-controller"
          tar -xzf dist/releases/hostlier-controller-linux-amd64.tar.gz -C "$RUNNER_TEMP/hostlier-controller"
          "$RUNNER_TEMP/hostlier-controller/hostlier-controller" help
      - name: Upload AMD64 controller installation bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hostlier-controller-linux-amd64
          path: |
            dist/releases/hostlier-controller-linux-amd64.tar.gz
            dist/releases/hostlier-controller-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload ARM64 controller installation bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hostlier-controller-linux-arm64
          path: |
            dist/releases/hostlier-controller-linux-arm64.tar.gz
            dist/releases/hostlier-controller-linux-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  mac-controller:
    name: macOS controller / ${{ matrix.arch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: go.sum
      - name: Build and smoke-test macOS controller
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist/releases
          binary="hostlier-controller-darwin-${TARGET_ARCH}"
          CGO_ENABLED=0 GOWORK=off GOOS=darwin GOARCH="$TARGET_ARCH" \
            go build -mod=readonly -trimpath -ldflags='-s -w' -o "dist/releases/$binary" ./cmd/hostlier-controller
          (cd dist/releases && shasum -a 256 "$binary" > "$binary.sha256")
          (cd dist/releases && shasum -a 256 -c "$binary.sha256")
          "dist/releases/$binary" help
      - name: Upload macOS controller and checksum
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hostlier-controller-darwin-${{ matrix.arch }}
          path: |
            dist/releases/hostlier-controller-darwin-${{ matrix.arch }}
            dist/releases/hostlier-controller-darwin-${{ matrix.arch }}.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish verified controller release
    needs: controller
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'Hostlier/hostlier'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a release commit from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Download this run's tested controller bundles
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name hostlier-controller-linux-amd64 --dir release-assets
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name hostlier-controller-linux-arm64 --dir release-assets
      - name: Verify both release checksums
        run: |
          cd release-assets
          sha256sum -c hostlier-controller-linux-amd64.tar.gz.sha256
          sha256sum -c hostlier-controller-linux-arm64.tar.gz.sha256
      - name: Publish a tagged GitHub Release
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Expected a vMAJOR.MINOR.PATCH tag'; exit 1; }
          gh release create "$GITHUB_REF_NAME" release-assets/hostlier-controller-linux-*.tar.gz release-assets/hostlier-controller-linux-*.tar.gz.sha256 --repo "$GITHUB_REPOSITORY" --verify-tag --latest --generate-notes
