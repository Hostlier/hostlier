version: 2
name: ollama-agent
packages:
  harnest:
    artifact: .harnest/build/ollama-agent
    baseImage: debian@sha256:a3bba7dc7dbcc1f37c2856c51fc9a7fac96608f50cb87b1b4e4d8b8c85ae988e
workload: service
endpoint:
  exposure: public
  port: 1907
  route: https://agent.example.com
health:
  path: /healthz
  timeoutSeconds: 180
env:
  OLLAMA_MODEL: deepseek-v4.1-flash:1017
  LITELLM_LOCAL_MODEL_COST_MAP: 'True'
  PYTHONDONTWRITEBYTECODE: '1'
secrets:
  OLLAMA_API_KEY: secret://ollama-cloud-key
  AGENT_ACCESS_TOKEN: secret://ollama-agent-access
resources:
  cpu: '0.5'
  memory: 512Mi
shutdown:
  graceSeconds: 30
